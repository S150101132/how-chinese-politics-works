<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#62716c" stroke-width="1.2"/></marker></defs><rect width="1440" height="1660" fill="#f7f4ee"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#243b35}.title{font-size:42px;font-weight:700}.head{font-size:28px;font-weight:700}.body{font-size:23px}.small{font-size:20px}.muted{fill:#62716c}</style><text x="60" y="76" class="title">先认清机构，再看它们之间的关系</text><text x="60" y="117" class="small">第一章 · 中央层面的入门总览｜制度依据：2018年宪法、2022年党章</text><rect x="60" y="155" width="1320" height="97" rx="14" fill="#e6ece4" stroke="#d4dcd4"/><text x="85" y="192" class="head">共同背景：中国共产党的领导</text><text x="85" y="230" class="small">政治领导与各机构的法定职权需要同时理解；这里的分区不表示彼此独立，也不表示个人排名。</text><rect x="60" y="282" width="420" height="665" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><rect x="510" y="282" width="420" height="665" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><rect x="960" y="282" width="420" height="665" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="84" y="326" class="head">01  党的中央组织</text><text x="534" y="326" class="head">02  国家机构</text><text x="984" y="326" class="head">03  军事领导制度</text><rect x="84" y="353" width="372" height="67" rx="14" fill="#edf1ea" stroke="#d4dcd4"/><text x="108" y="397" class="body">党的全国代表大会</text><path d="M270,426 L270,479" fill="none" stroke="#62716c" stroke-width="2" marker-end="url(#arrow)"/><text x="291" y="462" class="small">选举</text><rect x="84" y="492" width="372" height="67" rx="14" fill="#edf1ea" stroke="#d4dcd4"/><text x="108" y="535" class="body">中央委员会</text><path d="M270,565 L270,624" fill="none" stroke="#62716c" stroke-width="2" marker-end="url(#arrow)"/><text x="291" y="602" class="small">全体会议选举</text><rect x="84" y="638" width="372" height="133" rx="14" fill="#edf1ea" stroke="#d4dcd4"/><text x="108" y="678" class="body">中央政治局</text><text x="108" y="714" class="body">中央政治局常务委员会</text><text x="108" y="750" class="body">中央委员会总书记</text><text x="84" y="817" class="small">中央全会闭会期间：</text><text x="84" y="851" class="small">政治局及其常委会行使</text><text x="84" y="885" class="small">中央委员会职权。</text><rect x="534" y="347" width="372" height="80" rx="14" fill="#eff3f4" stroke="#d4dcd4"/><text x="551" y="379" class="body">全国人大及其常委会</text><text x="551" y="408" class="small">权力机关及其常设机关</text><rect x="534" y="437" width="372" height="80" rx="14" fill="#eff3f4" stroke="#d4dcd4"/><text x="551" y="469" class="body">国家主席</text><text x="551" y="498" class="small">依法履行国家主席职权</text><rect x="534" y="527" width="372" height="80" rx="14" fill="#eff3f4" stroke="#d4dcd4"/><text x="551" y="559" class="body">国务院</text><text x="551" y="588" class="small">最高国家行政机关</text><rect x="534" y="617" width="372" height="80" rx="14" fill="#eff3f4" stroke="#d4dcd4"/><text x="551" y="649" class="body">国家监察委员会</text><text x="551" y="678" class="small">最高监察机关</text><rect x="534" y="707" width="372" height="80" rx="14" fill="#eff3f4" stroke="#d4dcd4"/><text x="551" y="739" class="body">最高人民法院</text><text x="551" y="768" class="small">最高审判机关</text><rect x="534" y="797" width="372" height="80" rx="14" fill="#eff3f4" stroke="#d4dcd4"/><text x="551" y="829" class="body">最高人民检察院</text><text x="551" y="858" class="small">最高检察机关</text><text x="534" y="917" class="small">国家中央军委另在右栏展开。</text><rect x="984" y="354" width="372" height="125" rx="14" fill="#f3eee4" stroke="#d4dcd4"/><text x="1003" y="397" class="body">中共中央军事委员会</text><text x="1003" y="435" class="small">组成人员由中央委员会决定</text><rect x="984" y="499" width="372" height="164" rx="14" fill="#f3eee4" stroke="#d4dcd4"/><text x="1003" y="542" class="body">中华人民共和国</text><text x="1003" y="578" class="body">中央军事委员会</text><text x="1003" y="620" class="small">宪法规定：领导全国武装力量</text><text x="984" y="710" class="body">两个完整名称，</text><text x="984" y="749" class="body">须分别核对制度依据。</text><text x="984" y="807" class="small">本图不展开军事指挥链，</text><text x="984" y="842" class="small">不据简称混用任职程序。</text><text x="984" y="901" class="small">详见后续第八章。</text><rect x="60" y="971" width="1320" height="95" rx="14" fill="#eee7db" stroke="#d4dcd4"/><text x="84" y="1009" class="head">全国政协 · 政治协商、民主监督、参政议政</text><text x="84" y="1047" class="small">与全国人大性质和职能不同；不能把政协建议当作已经通过的法律。</text><text x="60" y="1120" class="head">连接旁边的动词，才是读图的关键</text><rect x="60" y="1150" width="300" height="68" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="83" y="1194" class="body">全国人大</text><path d="M385,1193 L925,1193" fill="none" stroke="#62716c" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="1176" class="small">选举</text><rect x="960" y="1150" width="420" height="68" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="983" y="1194" class="body">国家主席</text><rect x="60" y="1250" width="300" height="68" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="83" y="1294" class="body">国务院</text><path d="M385,1293 L925,1293" fill="none" stroke="#62716c" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="1276" class="small">负责并报告工作</text><rect x="960" y="1250" width="420" height="68" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="983" y="1294" class="body">全国人大</text><rect x="60" y="1350" width="300" height="68" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="83" y="1394" class="body">国务院</text><path d="M385,1393 L925,1393" fill="none" stroke="#62716c" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="1376" class="small">统一领导行政工作</text><rect x="960" y="1350" width="420" height="68" rx="14" fill="#fffdf8" stroke="#d4dcd4"/><text x="983" y="1394" class="body">地方国家行政机关</text><text x="60" y="1472" class="head">阅读提示</text><text x="60" y="1510" class="small">• 三列是阅读分区。国家中央军委属于国家机构，另列仅为便于看清其制度依据。</text><text x="60" y="1545" class="small">• 本图只画若干关系，省略地方层级、部门、具体任免程序及其他监督和协调联系。</text><text x="60" y="1580" class="small">• 制度定位不等于对实际运行效果的评价；图中没有列示现任人物。</text><text x="60" y="1627" class="small">《中国政治是怎么运转的》  /  图1  /  样章 v0.1  /  来源见章末注释2—14</text></svg>